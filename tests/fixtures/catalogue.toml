recipe = "F-16: Exact PNG byte construction and four sips/corrupt variants in § 4.7; seed none; still images, audio duration/format not applicable\n[verified; construction probe] Build `cover.png` with Python stdlib `struct` and `zlib`: PNG signature; IHDR width/height 64, bit depth 8, colour type 2 (RGB), compression/filter/interlace 0; raw rows each `b\"\\x00\" + bytes([40,120,200])*64`; one IDAT using `zlib.compress(raw,9)`; empty IEND. Each chunk has a big-endian length and CRC32 over chunk type+data. No ancillary chunks, EXIF, random pixels or timestamps. All fixtures below derive from this PNG, with seed none:\n\n- `cover.heic`: `sips -s format heic -s formatOptions 90 cover.png --out cover.heic` — 64×64 RGB.\n- `large.jpg`: `sips -s format jpeg -s formatOptions 90 -z 6000 6000 cover.png --out large.jpg` — 6000×6000 RGB.\n- `cmyk.jpg`: `sips -m \"/System/Library/ColorSync/Profiles/Generic CMYK Profile.icc\" -s format jpeg -s formatOptions 90 cover.png --out cmyk.jpg` — 64×64 CMYK, not RGB pixels with a CMYK label.\n- [judgement; untested corrupt branch] `corrupt.jpg`: exact bytes `b\"not an image\\n\"`; suffix does not define validity.\n\n[verified] `sips -g format -g pixelWidth -g pixelHeight -g space <file>` confirmed the four valid constructions on this Mac. [judgement] Record sips/macOS/ICC profile versions and hashes in the future catalogue; HEIC/JPEG byte hashes are platform-specific. Application conversion/resizing/error handling remains untested.\nVariant selection: Select cover.png only. sips/macOS/ICC identities are captured; JPEG/HEIC container byte identity across platforms is not promised."
