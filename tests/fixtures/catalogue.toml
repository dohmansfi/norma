recipe = "F-18/mark-invalid: F-13 copies with the stale tags and RIFF chunks in § 4.5; inherited seed/duration/format; WAV variant remains F-01 PCM\n[judgement] Pink-noise construction: for `N=seconds*48000`, draw `z=rng.standard_normal((N,2))` in one call. Set `f=fft.rfftfreq(N,1/48000)` and `w=zeros_like(f)`; for bins `20 <= f <= 20000`, set `w=1/sqrt(f)`. Compute `y=fft.irfft(fft.rfft(z,axis=0)*w[:,None],n=N,axis=0)`, then divide each channel by `sqrt(mean(y*y,axis=0))`. Apply only the constant gain in the table (or clip then gain for F-06). This is an explicitly defined band-limited pink-noise fixture, not a claim of equivalence to `anoisesrc`.\n[judgement; untested] F-13's canonical object is: title `Perché 東京 🎵`; artist `Test Artist`; album_artist `Norma fixtures`; album `Demo set`; date `2026-10-05`; track 3; track_total 12; disc 1; disc_total 2; genre `Demo`; composer `Composer`; comment `Line one\\nLine two; comma, quote \"`; compilation true; artwork = F-16 `cover.png` (front cover, type 3); extras = `DEMO_NOTE=seedless`. All text is NFC. Use `mutagen`, the planned runtime dependency, and the exact native field mappings in Norma's format mapping tables; encode ID3v2.3 text as UTF-16, `COMM` language `eng`, track/disc as `3/12` and `1/2`, date as `TYER=2026`, `TDAT=0510`; MP4 tuple fields as `[(3,12)]`/`[(1,2)]`, compilation as true, PNG cover type; FLAC separate number/total fields and a PNG picture block. For AIFF/WAV use their mutagen container classes, not a detached `.id3` sidecar. Do not install another test-only tag library.\n\n- [judgement] Create the conflicting WAV by copying F-01 through `ffmpeg -i F-01.wav -map 0:a:0 -map_metadata -1 -c:a copy -metadata title=\"INFO title\" conflict.wav`, then add the canonical ID3 object in its RIFF ID3 chunk without removing INFO. Assert raw INFO title `INFO title`, raw ID3 title `Perché 東京 🎵`; canonical title comes from ID3, and one title conflict is reported. Other F-13 WAV fields live in ID3. Date read-back uses the canonical full date, not the source frame names.\n- [judgement] F-18 stale-tag copies add `REPLAYGAIN_TRACK_GAIN=-3.00 dB`, `REPLAYGAIN_TRACK_PEAK=0.900000`, `ENCODER=fixture-old`, and iTunNORM containing ten space-separated `000003E8` words. Use FLAC native comments, ID3 `TXXX` for ReplayGain and `TSSE` for the old encoder, `COMM(eng,desc=\"iTunNORM\")` for Sound Check, MP4 freeforms under `com.apple.iTunes` for ReplayGain/iTunNORM and `©too` for the encoder. Audio streams remain unchanged. Mark variants use the complete valid MD26 example, plus the old incomplete `v=1;target=-14;tp=-1;gain=0;mode=linear` as deliberately malformed. Both present marks trigger `already_processed` without force; only the complete valid one supplies a verify reference. Forced processing removes the old mark by design and generates a new final mark unless omitted.\n- [judgement] F-18 WAV: take F-01, append the three valid RIFF chunks below and update RIFF size to total byte length minus 8. For every chunk write four-byte ID, little-endian uint32 payload length, payload, then one zero padding byte only if length is odd. Original `fmt ` and `data` chunks are unchanged.\n  - `cue ` payload is `struct.pack(\"<III4sIII\",1,1,48000,b\"data\",0,0,48000)` — one cue at frame 48,000.\n  - `bext` payload is 602 bytes: description `Norma fixture` zero-padded to 256, originator `WS-07` padded to 32, originator reference `F-18` padded to 32, ASCII date `2026-10-05` (10), time `00:00:00` (8), little-endian uint64 time reference 0, little-endian uint16 version 1, 64 zero UMID bytes, 190 zero reserved bytes; no coding history.\n  - `iXML` payload is exact UTF-8 `b\"<BWFXML><PROJECT>Norma fixture</PROJECT></BWFXML>\"`.\n\n[judgement] RIFF read-back must locate each chunk and compare its payload exactly before running the application. A `bext` preservation test compares its bytes, not a guessed ffprobe tag expansion; metadata-loss tests inventory chunk IDs independently of what FFmpeg happens to expose.\nVariant selection: Stale F-13/flac24 plus old malformed v=1;target=-14;tp=-1;gain=0;mode=linear."
