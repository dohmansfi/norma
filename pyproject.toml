[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[project]
name = "norma"
version = "0.1.0"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["mutagen>=1.48.1"]

[project.scripts]
norma = "norma.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "numpy>=2.4.6",
    "soundfile>=0.14.0",
    "pyloudnorm>=0.2.0",
    "scipy>=1.17.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/norma"]

[tool.hatch.build.targets.sdist]
include = ["/src/norma", "/pyproject.toml", "/LICENSE", "/NOTICE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib --strict-markers"
